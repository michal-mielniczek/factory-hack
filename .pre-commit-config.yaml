repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude .
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest (manual)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [manual]
